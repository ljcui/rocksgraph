syntax = "proto3";
package meta;

import "raft.proto";

enum WriteBatchKind {
    UNKNOWN = 0;
    GRAPH_WRITE = 1;
    ID_GENERATOR = 2;
    GRAPH_INDEX_DDL = 3;
}

message RaftRequest {
    uint64 id = 1;
    WriteBatchKind wb_kind = 2;
    bytes wb_data = 3;
}

message RaftMessage {
    string graph = 1;
    raftpb.Message message = 2;
    SnapshotFrame snapshot_frame = 3;
}

message RaftNodeInfo {
    uint64 node_id       = 1;
    string ip            = 2;
    int32 bolt_port      = 3;
    int32 raft_poft      = 4;
    bool is_leader       = 5;
    bool is_learner      = 6;
    string graph         = 7;
}

message RaftNodeInfos {
    map<uint64, RaftNodeInfo> nodes = 1;
}

// Snapshot.data contains this small reference, never the database files.
message SnapshotReference {
    uint32 version = 1;
    string id = 2;
    RaftNodeInfos node_infos = 3;
}

message SnapshotFile {
    string name = 1;
    uint64 size = 2;
    uint32 checksum = 3;
}

// Sent on a dedicated, acknowledged connection. One file header or bounded
// data chunk per frame keeps both the file list and file contents streaming.
message SnapshotFrame {
    enum Kind {
        UNKNOWN = 0;
        BEGIN = 1;
        FILE = 2;
        CHUNK = 3;
        FINISH = 4;
        ACK = 5;
    }
    Kind kind = 1;
    string transfer_id = 2;
    raftpb.Message message = 3;
    uint64 file_count = 4;
    SnapshotFile file = 5;
    uint64 offset = 6;
    bytes data = 7;
    uint32 checksum = 8;
    string error = 9;
}

// Written before switching GraphDB data. Startup finishes the same installation
// before opening Raft, so a crash cannot expose mismatched data and log state.
message SnapshotInstall {
    raftpb.Snapshot snapshot = 1;
    raftpb.HardState hard_state = 2;
    repeated raftpb.Entry entries = 3;
    string directory = 4;
}
